# agent
agent_name: octax_agent

# env setting
env:
  env: Octax
  game: Octax-Brix-v0
  base_seed: 0
  n_skip: 1
  n_stack: 4
  max_episode_steps: 4500
  gray_scale: True
  image_based: True
  clip_reward: False
  obs_shape: [1, 32, 64]
  episodic: True

rl:
  discount: 0.997
  unroll_steps: 5
  td_steps: 5
  auto_td_steps: 30000
  td_lambda: 0.95

optimizer:
  type: SGD
  lr: 0.2
  lr_decay_type: none
  lr_warm_up: 0.01
  lr_decay_rate: 0.1
  lr_decay_steps: 100000
  weight_decay: 1e-4
  momentum: 0.9

priority:
  use_priority: True
  priority_prob_alpha: 1.0
  priority_prob_beta: 1.0
  min_prior: 0.000001

train:
  load_model_path: ''
  batch_size: 256
  training_steps: 100000
  offline_training_steps: 20000
  start_transitions: 2000

  eval_n_episode: 10
  eval_interval: 10000

  self_play_update_interval: 100
  reanalyze_update_interval: 200
  save_ckpt_interval: 10000

  mini_batch_size: 256
  reanalyze_ratio: 1.0

  reward_loss_coeff: 1.0
  value_loss_coeff: 0.5
  policy_loss_coeff: 1.0
  consistency_coeff: 5.0
  decorrelation_coeff: 0.01
  off_diag_coeff: 5e-3
  entropy_coeff: 5e-3

  max_grad_norm: 5
  change_temperature: True

  periodic_reset: False
  value_reanalyze: False
  path_consistency: False
  use_decorrelation: False
  value_policy_detach: False
  optimal_Q: False
  v_num: 1
  value_target: 'mixed'
  use_IQL: False
  IQL_weight: 0.7
  start_use_mix_training_steps: 3e4
  mixed_value_threshold: 5e3

data:
  num_envs: 4
  buffer_size: 1000000
  total_transitions: 100000
  top_transitions: 2e5
  trajectory_size: 400
  save_video: False
  save_as_dataset: False

mcts:
  language: cython
  num_simulations: 16
  num_top_actions: 4
  c_visit: 50
  c_scale: 0.1
  c_base: 19652
  c_init: 1.25
  dirichlet_alpha: 0.3
  explore_frac: 0.25
  value_minmax_delta: 0.01
  vis: ['print']
  mpc_horizon: 1
  use_gumbel: True

model:
  noisy_net: False
  action_embedding: True
  action_embedding_dim: 16
  down_sample: True
  state_norm: False
  value_prefix: True
  value_target: bootstrapped
  GAE_max_steps: 15
  init_zero: True
  num_blocks: 1
  num_channels: 64
  reduced_channels: 16

  projection_layers: [1024, 1024]
  prjection_head_layers: [256, 1024]

  fc_layers: [32]
  lstm_hidden_size: 512
  lstm_horizon_len: 5
  policy_loss_type: reanalyze

  reward_support:
    range: [-300, 300]
    scale: 1
    env: Atari
    bins: 51
    type: support
  value_support:
    range: [-300, 300]
    scale: 1
    env: Atari
    bins: 51
    type: support

actors:
  data_worker: 1
  batch_worker: 8

wandb:
  project: 'ez-v2-octax'
  tag: 'Octax'
